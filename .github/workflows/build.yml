name: Buduj i publikuj stronę

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"      # codziennie ok. 5:17 czasu PL – świeże publikacje z ORCID
  workflow_dispatch:           # przycisk "Run workflow" do ręcznego odświeżenia

# Minimalne uprawnienia: domyślnie tylko odczyt, każde zadanie dostaje tylko to, czego potrzebuje
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # zapis cache ORCID do repozytorium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 pillow==11.3.0
      - run: python build.py
      - name: Zapisz cache ORCID (zapas na wypadek awarii API)
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/orcid_cache.json data/orcid_person.json || true
          git diff --cached --quiet || git commit -m "Aktualizacja cache ORCID" && git push || true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
