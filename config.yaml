bio: >
  I am an associate professor at the Faculty of Geodesy and Cartography,
  Warsaw University of Technology (discipline: civil engineering, geodesy and
  transport). My research focuses on Building Information Modelling (BIM),
  BIM–GIS integration, formal ontologies (DOLCE, OWL 2 DL), artificial
  intelligence and machine learning in AEC, IFC standards, HBIM and digital
  twins. I am the author of the monograph “Propedeutyka BIM – filozofia
  modelowania informacji o obiekcie budowlanym” (WUT Press, 2024) and of more
  than 120 publications. I teach BIM at the graduate level, supervise doctoral,
  master's and engineering theses, and work closely with industry on BIM
  implementation.

bio_pl: >
  Jestem profesorem uczelni na Wydziale Geodezji i Kartografii Politechniki
  Warszawskiej (dyscyplina: inżynieria lądowa, geodezja i transport). Zajmuję się
  modelowaniem informacji o obiekcie budowlanym (BIM), integracją BIM–GIS,
  ontologiami formalnymi (DOLCE, OWL 2 DL), sztuczną inteligencją i uczeniem
  maszynowym w budownictwie, standardami IFC, HBIM oraz cyfrowymi bliźniakami.
  Jestem autorem monografii „Propedeutyka BIM – filozofia modelowania informacji
  o obiekcie budowlanym” (Oficyna Wydawnicza PW, 2024) i ponad 120 publikacji.
  Prowadzę zajęcia z BIM na studiach magisterskich, opiekuję się pracami
  doktorskimi, magisterskimi i inżynierskimi oraz współpracuję z przemysłem
  przy wdrożeniach BIM.

