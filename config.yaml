bio: >
  My research focuses on Building Information Modelling (BIM), BIM–GIS
  integration, formal ontologies (DOLCE, OWL 2 DL), machine learning in AEC,
  IFC standards and digital twins. I teach BIM at the graduate level and
  supervise doctoral, master's and engineering theses.

research_interests:
  - BIM and openBIM (IFC, IDS, BCF)
  - BIM–GIS integration and 3D cadastre
  - Formal ontologies in AEC (DOLCE, OWL 2 DL)
  - AI agents and machine learning in AEC
  - Digital twins and HBIM

