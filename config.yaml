bio: >
  My research focuses on Building Information Modelling (BIM), BIM–GIS
  integration, formal ontologies (DOLCE, OWL 2 DL), machine learning in AEC,
  IFC standards and digital twins. I teach BIM at the graduate level and
  supervise doctoral, master's and engineering theses.

bio_pl: >
  Zajmuję się modelowaniem informacji o budynku (BIM), integracją BIM–GIS,
  ontologiami formalnymi (DOLCE, OWL 2 DL), uczeniem maszynowym w budownictwie,
  standardami IFC oraz cyfrowymi bliźniakami. Prowadzę zajęcia z BIM na studiach
  magisterskich oraz opiekuję się pracami doktorskimi, magisterskimi i inżynierskimi.

research_interests_pl:
